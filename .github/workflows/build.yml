name: Build Minecraft LCE Server

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
    - uses: actions/checkout@v4

    - name: Configure CMake
      run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64

    - name: Build Project
      run: cmake --build build --config Debug --target MinecraftClient

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: MinecraftClient-Build
        path: build/Debug/
